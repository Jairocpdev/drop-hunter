AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  HunterBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: drop-hunter-events

  StockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: drop-hunter-stock
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sku
          AttributeType: S
      KeySchema:
        - AttributeName: sku
          KeyType: HASH

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: drop-hunter-notifier
      Runtime: python3.12
      CodeUri: ./src/notifier
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: drop-hunter-stock
          BOT_TOKEN: "{{resolve:ssm:/drop-hunter/bot-token}}"
          CHAT_ID: "{{resolve:ssm:/drop-hunter/chat-id}}"
          EVENT_BUS_NAME: drop-hunter-events
      Policies:
        - DynamoDBCrudPolicy:
            TableName: drop-hunter-stock
      Events:
        StockReturned:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref HunterBus
            Pattern:
              source:
                - drop-hunter.scraper
              detail-type:
                - stock_return

  ArtwalkScraper:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: drop-hunter-artwalk-scraper
      Runtime: python3.12
      CodeUri: ./src/artwalk
      Handler: artwalk_scraper.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: drop-hunter-stock
          EVENT_BUS_NAME: drop-hunter-events
      Policies:
        - DynamoDBCrudPolicy:
            TableName: drop-hunter-stock
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref HunterBus
      Events:
        Cada2Min:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)
