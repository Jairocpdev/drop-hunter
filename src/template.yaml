AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 60

Resources:
  StockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: drop-hunter-stock
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sku
          AttributeType: S
      KeySchema:
        - AttributeName: sku
          KeyType: HASH

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: drop-hunter-scraper
      PackageType: Image
      ImageUri: scraper:latest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StockTable
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Environment:
        Variables:
          TABLE_NAME: !Ref StockTable
          EVENT_BUS_NAME: default

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: drop-hunter-notifier
      Runtime: python3.11
      CodeUri: src/notifier/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StockTable
      Environment:
        Variables:
          TABLE_NAME: !Ref StockTable
      Events:
        StockReturned:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: ["drop.hunter"]
              detail-type: ["stock_returned"]

  ScraperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: drop-hunter-every-10min
      ScheduleExpression: "rate(10 minutes)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ScraperFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeScraper
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScraperFunction.Arn